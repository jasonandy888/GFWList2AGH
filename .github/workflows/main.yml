name: Build & GFWList2AGH

on:
  schedule:
    - cron: "37 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Step 1 - Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Step 2 - Build GFWList2AGH
        run: |
          bash release.sh

      - name: Step 3 - Release GFWList2AGH
        run: |
          curl -s "https://raw.githubusercontent.com/jasonandy888/Toolkit/main/Git.sh" > "/tmp/Git.sh"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          sudo bash "/tmp/Git.sh" -u "jasonandy888" -e "jasonandy888@qq.com" -f "." -r "GFWList2AGH" -i "Generated by GitHub Actions" -m "push"
